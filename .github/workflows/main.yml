name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      # 1. Создаем структуру проекта
      - run: flutter create --org com.example .
      
      # 2. Добавляем библиотеки, которые требуются для вашего Crypto Wallet
      - run: flutter pub add google_fonts cupertino_icons
      
      # 3. Запускаем сборку
      - run: flutter build apk --release
      
      # 4. Сохраняем готовый файл для скачивания
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-wallet-apk
          path: build/app/outputs/flutter-apk/app-release.apk
